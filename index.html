<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画图库管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --surface2: #1c1c20;
    --border: #2a2a30;
    --text: #e8e6e0;
    --text-muted: #6b6970;
    --text-dim: #3d3c42;
    --accent: #e8c97a;
    --accent-dim: rgba(232,201,122,0.15);
    --red: #e85d5d;
    --red-dim: rgba(232,93,93,0.18);
    --green: #5de8a0;
    --radius: 4px;
    --mono: 'DM Mono', monospace;
    --serif: 'Noto Serif SC', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
  }

  /* ── Layout ── */
  #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  #header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 10;
  }

  #header-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  #breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 12px;
  }

  #breadcrumb .crumb-link {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  #breadcrumb .crumb-link:hover { opacity: 0.7; }
  #breadcrumb .sep { color: var(--text-dim); }

  #header-stats {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #header-stats .del-count {
    color: var(--red);
  }

  #header-stats .export-btn-header {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--green);
    padding: 4px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  #header-stats .export-btn-header:hover {
    background: rgba(93,232,160,0.1);
    border-color: var(--green);
  }

  /* ── Scroll container ── */
  #scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px;
    scroll-behavior: smooth;
  }

  #scroll-area::-webkit-scrollbar { width: 4px; }
  #scroll-area::-webkit-scrollbar-track { background: transparent; }
  #scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Loading screen ── */
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: var(--bg);
    z-index: 100;
    font-family: var(--mono);
  }

  #loading .load-title {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--text);
  }

  #loading .load-sub {
    color: var(--text-muted);
    font-size: 12px;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Mode banner ── */
  #mode-banner {
    position: fixed;
    top: 57px; left: 0; right: 0;
    height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 9;
    transform: translateY(-100%);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  #mode-banner.visible { transform: translateY(0); }
  #mode-banner.delete-mode {
    background: var(--red-dim);
    color: var(--red);
    border-bottom: 1px solid rgba(232,93,93,0.3);
  }

  /* ── Folder Grid ── */
  #folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }

  .folder-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    aspect-ratio: 2/3;
    display: flex;
    flex-direction: column;
  }

  .folder-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .folder-card.delete-mode:hover {
    border-color: var(--red);
  }

  .folder-card.marked {
    border-color: var(--red) !important;
    outline: 2px solid var(--red);
    outline-offset: -2px;
  }

  .folder-cover {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--surface2);
  }

  .folder-cover img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .folder-cover img.loaded { opacity: 1; }

  .folder-cover-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 24px;
  }

  .folder-info {
    padding: 8px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .folder-name {
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .folder-count {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .mark-overlay {
    position: absolute;
    inset: 0;
    background: var(--red-dim);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    z-index: 2;
  }
  .marked .mark-overlay { opacity: 1; }

  .mark-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--red);
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 18px;
  }

  /* ── Pagination ── */
  #pagination-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 0;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 13px;
    width: 100%;
  }
  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--mono);
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .page-input {
    width: 50px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px;
    border-radius: var(--radius);
    text-align: center;
    font-family: var(--mono);
  }
  .page-input:focus {
    border-color: var(--accent);
    outline: none;
  }

  /* ── Image Grid (inner page) ── */
  #image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }

  .img-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: default;
    aspect-ratio: 2/3;
  }

  .img-card.delete-mode {
    cursor: pointer;
  }

  .img-card.delete-mode:hover { border-color: var(--red); }
  .img-card.delete-mode:hover .mark-overlay { opacity: 0.4; }

  .img-card.marked {
    border-color: var(--red) !important;
    outline: 2px solid var(--red);
    outline-offset: -2px;
  }
  .img-card.marked .mark-overlay { opacity: 1; }

  .img-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .img-card img.loaded { opacity: 1; }

  .img-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 4px 6px;
    font-size: 9px;
    color: var(--text-muted);
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Floating Controls ── */
  #float-bar {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 20;
    align-items: flex-end;
  }

  .fab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--surface2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .fab:hover { border-color: var(--accent); color: var(--accent); }

  .fab.mode-toggle.active-delete {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-dim);
  }



  .fab-icon { font-size: 16px; line-height: 1; }

  /* ── Empty state ── */
  .empty-state {
    grid-column: 1/-1;
    padding: 80px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 16px; }

  /* ── Scroll-to-top ── */
  #back-top {
    position: fixed;
    bottom: 24px; left: 24px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
    transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #back-top:hover { color: var(--accent); border-color: var(--accent); }
  #back-top.visible { display: flex; }

  /* ── Notification toast ── */
  #toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 30;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Mode padding (when banner visible) ── */
  body.delete-active #scroll-area { padding-top: 52px; }

  /* ── Modal ── */
  #modal {
    position: fixed; inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }
  #modal.open {
    opacity: 1;
    pointer-events: all;
  }

  #modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.92);
  }

  /* navigation zones sit above backdrop, beside the image */
  #modal-inner {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .modal-nav {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: rgba(255,255,255,0.3);
    font-size: 40px;
    transition: color 0.15s;
    user-select: none;
    z-index: 1;
  }
  .modal-nav:hover {
    color: rgba(255,255,255,0.9);
  }
  #modal-prev { left: 0; justify-content: flex-start; padding-left: 40px; }
  #modal-next { right: 0; justify-content: flex-end; padding-right: 40px; }
  .modal-nav.hidden { opacity: 0; pointer-events: none; }

  #modal-img-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  #modal-img {
    max-height: 100vh;
    max-width: 100%;
    width: auto;
    height: 100vh;
    object-fit: contain;
    display: block;
    user-select: none;
    pointer-events: none; /* allow clicks to pass through to nav zones */
    transition: opacity 0.15s;
  }
  #modal-img.loading { opacity: 0.3; }

  /* close button */
  #modal-close {
    position: fixed;
    top: 16px; right: 20px;
    z-index: 60;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(30,30,34,0.8);
    color: rgba(255,255,255,0.7);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    transition: all 0.15s;
    line-height: 1;
  }
  #modal-close:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(30,30,34,0.95);
  }

  /* counter */
  #modal-counter {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    font-family: var(--mono);
    pointer-events: none;
    letter-spacing: 0.1em;
  }

  /* img-card cursor in view mode */
  .img-card.view-mode { cursor: zoom-in; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="load-title">漫画图库</div>
  <div class="load-sub">正在加载结构文件…</div>
</div>

<div id="app" style="display:none">
  <div id="header">
    <div id="header-title">漫画图库</div>
    <div id="breadcrumb">
      <span class="crumb-link" id="crumb-home" onclick="goHome()">全部文件夹</span>
      <span class="sep" id="crumb-sep" style="display:none">›</span>
      <span id="crumb-folder" style="display:none"></span>
    </div>
    <div id="header-stats">
      <button class="export-btn-header" id="export-btn" onclick="exportList()" style="display:none">
        <span>⬇</span> 导出删除列表
      </button>
      <span id="stat-text"></span>
    </div>
  </div>

  <div id="mode-banner">
    🗑 删除模式 — 点击图片/文件夹标记删除
  </div>

  <div id="scroll-area">
    <div id="folder-grid"></div>
    <div id="pagination-container" style="display:none"></div>
    <div id="image-grid" style="display:none"></div>
  </div>
</div>

<div id="float-bar">
  <button class="fab" id="hide-btn" onclick="toggleHideMarked()">
    <span class="fab-icon" id="hide-icon">👻</span>
    <span id="hide-label">隐藏已标记</span>
  </button>
  <button class="fab mode-toggle" id="mode-btn" onclick="toggleMode()">
    <span class="fab-icon" id="mode-icon">👁</span>
    <span id="mode-label">浏览模式</span>
  </button>
</div>

<button id="back-top" onclick="scrollToTop()" title="回到顶部">↑</button>

<div id="toast"></div>

<!-- ── Modal ── -->
<div id="modal">
  <div id="modal-backdrop"></div>
  <div id="modal-inner">
    <div class="modal-nav" id="modal-prev" onclick="modalNav(-1)">&#8249;</div>
    <div id="modal-img-wrap">
      <img id="modal-img" src="" alt="">
    </div>
    <div class="modal-nav" id="modal-next" onclick="modalNav(1)">&#8250;</div>
  </div>
</div>
<button id="modal-close" onclick="closeModal()" style="display:none">✕</button>
<div id="modal-counter" style="display:none"></div>

<script>
// ─────────────────────────────────────────────
//  Config
// ─────────────────────────────────────────────
const BASE_URL = 'https://p1.dlozs.top/manga';
let supabaseCfg = null;

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let data        = [];          // parsed structure.json
let deletedSet  = new Set();   // paths marked for deletion
let mode        = 'view';      // 'view' | 'delete'
let hideMarked  = false;       // hide fully marked folders
let curFolder   = null;        // null = home, else folder object
let currentPage = 1;
const ITEMS_PER_PAGE = 20;
let homeScrollTop = 0;

let lazyObs     = null;        // IntersectionObserver instance

// modal state
let modalIndex  = 0;
let modalList   = [];          // array of {src, path} for current folder

// ─────────────────────────────────────────────
//  Supabase Sync Helpers
// ─────────────────────────────────────────────
function getHeaders() {
  return {
    'apikey': supabaseCfg.SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${supabaseCfg.SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function loadSupabaseState() {
  if (!supabaseCfg?.SUPABASE_URL) return;
  try {
    // 关键点：在 URL 后面加上 &limit=50000
    const res = await fetch(`${supabaseCfg.SUPABASE_URL}/rest/v1/manga_deletions?select=path&limit=50000`, {
      headers: getHeaders()
    });
    if (res.ok) {
      const rows = await res.json();
      deletedSet = new Set(rows.map(r => r.path));
    }
  } catch(e) {
    console.warn('远端状态加载失败', e);
  }

  try {
    const progRes = await fetch(`${supabaseCfg.SUPABASE_URL}/rest/v1/manga_progress?id=eq.1`, {
      headers: getHeaders()
    });
    if (progRes.ok) {
      const progRows = await progRes.json();
      if (progRows.length > 0 && progRows[0].page_num) {
        currentPage = progRows[0].page_num;
      }
    }
  } catch(e) {
    console.warn('远端进度加载失败', e);
  }
}

async function syncProgress(page) {
  if (!supabaseCfg?.SUPABASE_URL) return;
  try {
    await fetch(`${supabaseCfg.SUPABASE_URL}/rest/v1/manga_progress?id=eq.1`, {
      method: 'PATCH',
      headers: { ...getHeaders(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ page_num: page })
    });
  } catch(e) { console.error('同步进度失败', e); }
}

async function syncInsert(paths) {
  if (!supabaseCfg?.SUPABASE_URL || !paths.length) return;
  try {
    const body = paths.map(p => ({ path: p }));
    await fetch(`${supabaseCfg.SUPABASE_URL}/rest/v1/manga_deletions`, {
      method: 'POST',
      headers: { ...getHeaders(), 'Prefer': 'resolution=ignore-duplicates' },
      body: JSON.stringify(body)
    });
  } catch(e) { console.error('同步增加失败', e); }
}

async function syncDelete(paths) {
  if (!supabaseCfg?.SUPABASE_URL || !paths.length) return;
  try {
    const encodedList = paths.map(p => `"${p.replace(/"/g, '""')}"`).join(',');
    await fetch(`${supabaseCfg.SUPABASE_URL}/rest/v1/manga_deletions?path=in.(${encodeURIComponent(encodedList)})`, {
      method: 'DELETE',
      headers: getHeaders()
    });
  } catch(e) { console.error('同步删除失败', e); }
}

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
async function init() {
  try {
    // 1. Load config
    const cfgRes = await fetch('./config.json');
    if (cfgRes.ok) {
      supabaseCfg = await cfgRes.json();
    }
    
    // 2. Load Supabase state
    if (supabaseCfg?.SUPABASE_URL) {
      document.querySelector('#loading .load-sub').textContent = '正在与云端同步标记...';
      await loadSupabaseState();
    }

    // 3. Load structure
    document.querySelector('#loading .load-sub').textContent = '正在加载图书库...';
    const res  = await fetch('./structure.json');
    if (!res.ok) throw new Error(res.statusText);
    data = await res.json();
  } catch(e) {
    document.querySelector('#loading .load-sub').textContent = '❌ 无法加载初始文件: ' + e.message;
    return;
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  
  history.replaceState({ view: 'home' }, '', window.location.pathname);
  renderHome();
}

window.addEventListener('popstate', (e) => {
  const state = e.state || {};
  if (document.getElementById('modal').classList.contains('open')) {
    closeModal(true);
  } else if (state.view === 'home' || !state.view) {
    if (curFolder) {
      goHome(true);
    }
  } else if (state.view === 'folder') {
    const f = data.find(f => f.name === state.name);
    if (f && (!curFolder || curFolder.name !== state.name)) {
      openFolder(f, true);
    }
  }
});

// ─────────────────────────────────────────────
//  Mode toggle
// ─────────────────────────────────────────────
function toggleMode() {
  mode = mode === 'view' ? 'delete' : 'view';
  applyMode();
}

function applyMode() {
  const btn    = document.getElementById('mode-btn');
  const icon   = document.getElementById('mode-icon');
  const label  = document.getElementById('mode-label');
  const banner = document.getElementById('mode-banner');

  if (mode === 'delete') {
    btn.classList.add('active-delete');
    icon.textContent  = '🗑';
    label.textContent = '删除模式';
    banner.classList.add('visible', 'delete-mode');
    document.body.classList.add('delete-active');
  } else {
    btn.classList.remove('active-delete');
    icon.textContent  = '👁';
    label.textContent = '浏览模式';
    banner.classList.remove('visible', 'delete-mode');
    document.body.classList.remove('delete-active');
  }

  // refresh interactive classes on cards
  if (curFolder) {
    document.querySelectorAll('.img-card').forEach(card => {
      card.classList.toggle('delete-mode', mode === 'delete');
      card.classList.toggle('view-mode',   mode === 'view');
    });
  } else {
    document.querySelectorAll('.folder-card').forEach(card => {
      card.classList.toggle('delete-mode', mode === 'delete');
    });
  }
}

function toggleHideMarked() {
  hideMarked = !hideMarked;
  const btn = document.getElementById('hide-btn');
  const icon = document.getElementById('hide-icon');
  if (hideMarked) {
    btn.style.borderColor = 'var(--accent)';
    btn.style.color = 'var(--accent)';
    icon.textContent = '🙈';
  } else {
    btn.style.borderColor = '';
    btn.style.color = '';
    icon.textContent = '👻';
  }
  if (!curFolder) renderHome();
}

// ─────────────────────────────────────────────
//  Stats bar
// ─────────────────────────────────────────────
function updateStats() {
  const exportBtn = document.getElementById('export-btn');
  const statEl    = document.getElementById('stat-text');

  if (deletedSet.size === 0) {
    statEl.innerHTML = '';
    exportBtn.style.display = 'none';
  } else {
    statEl.innerHTML = `已标记删除 <span class="del-count">${deletedSet.size}</span> 张`;
    exportBtn.style.display = 'flex';
  }
}

// ─────────────────────────────────────────────
//  Lazy loading helper
// ─────────────────────────────────────────────
function setupLazy(container) {
  if (lazyObs) lazyObs.disconnect();
  
  lazyObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        if (!img.src) {
          img.src = img.dataset.src;
          img.onload  = () => img.classList.add('loaded');
          img.onerror = () => img.classList.add('loaded');
        }
      }
    });
  }, { rootMargin: '300px' });

  container.querySelectorAll('img[data-src]').forEach(img => lazyObs.observe(img));
}

function clearObservers() {
  if (lazyObs) {
    lazyObs.disconnect();
    lazyObs = null;
  }
}

// ─────────────────────────────────────────────
//  Home page
// ─────────────────────────────────────────────
function goHome(fromPopState = false) {
  if (fromPopState !== true && curFolder) {
    history.back();
    return;
  }
  curFolder = null;
  mode      = 'view';
  applyMode();
  renderHome();
}

function renderHome() {
  curFolder = null;
  clearObservers();

  document.getElementById('folder-grid').style.display = 'grid';
  document.getElementById('image-grid').style.display  = 'none';
  document.getElementById('crumb-sep').style.display   = 'none';
  document.getElementById('crumb-folder').style.display = 'none';

  const grid = document.getElementById('folder-grid');
  grid.innerHTML = '';

  const pagContainer = document.getElementById('pagination-container');
  if (pagContainer) pagContainer.style.display = 'none';

  if (!data.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div>没有找到文件夹</div>';
    updateStats();
    return;
  }

  const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  if (currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const end = start + ITEMS_PER_PAGE;
  const pageData = data.slice(start, end);

  pageData.forEach(folder => {
    const coverImg  = folder.children?.[0]?.name;
    const coverSrc  = coverImg ? `${BASE_URL}/${encodeURIComponent(folder.name)}/${encodeURIComponent(coverImg)}` : null;
    const count     = folder.children?.length || 0;

    // Check if whole folder is marked
    const folderPath  = `manga/${folder.name}`;
    const allMarked   = folder.children?.length > 0 && folder.children.every(c => deletedSet.has(`manga/${folder.name}/${c.name}`));

    if (hideMarked && allMarked) return;

    const card = document.createElement('div');
    card.className = 'folder-card' + (allMarked ? ' marked' : '');
    card.dataset.folder = folder.name;

    card.innerHTML = `
      <div class="folder-cover">
        ${coverSrc
          ? `<img data-src="${coverSrc}" alt="${folder.name}">`
          : `<div class="folder-cover-placeholder">📁</div>`}
        <div class="mark-overlay"><div class="mark-icon">✕</div></div>
      </div>
      <div class="folder-info">
        <div class="folder-name" title="${folder.name}">${folder.name}</div>
        <div class="folder-count">${count} 张图片</div>
      </div>
    `;

    card.addEventListener('click', () => {
      if (mode === 'delete') {
        toggleFolderMark(folder, card);
      } else {
        openFolder(folder);
      }
    });

    grid.appendChild(card);
  });

  if (totalPages > 1 && pagContainer) {
    pagContainer.style.display = 'flex';
    pagContainer.innerHTML = `
      <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
      <span id="page-text" onclick="editPage()" style="cursor: pointer; padding: 0 8px; font-weight: bold; transition: color 0.15s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color=''">
        ${currentPage} / ${totalPages}
      </span>
      <input type="number" id="page-input-edit" class="page-input" style="display:none; width: 60px;" min="1" max="${totalPages}" value="${currentPage}" onblur="cancelEditPage()" onkeypress="if(event.key === 'Enter') jumpPageEdit(this.value, ${totalPages})">
      <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
    `;
  }

  setupLazy(grid);
  updateStats();

  if (homeScrollTop > 0) {
    requestAnimationFrame(() => {
      document.getElementById('scroll-area').scrollTop = homeScrollTop;
      homeScrollTop = 0;
    });
  } else {
    document.getElementById('scroll-area').scrollTop = 0;
  }
}

function changePage(page) {
  const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  homeScrollTop = 0;
  syncProgress(page);
  renderHome();
}

function editPage() {
  document.getElementById('page-text').style.display = 'none';
  const input = document.getElementById('page-input-edit');
  input.style.display = 'inline-block';
  input.focus();
  input.select();
}

function cancelEditPage() {
  setTimeout(() => {
    const text = document.getElementById('page-text');
    const input = document.getElementById('page-input-edit');
    if (text && input) {
      text.style.display = 'inline-block';
      input.style.display = 'none';
    }
  }, 100);
}

function jumpPageEdit(val, total) {
  let p = parseInt(val, 10);
  if (!isNaN(p)) {
    if (p < 1) p = 1;
    if (p > total) p = total;
    changePage(p);
  }
}

function toggleFolderMark(folder, card) {
  const children = folder.children || [];
  if (!children.length) return;

  const paths = children.map(c => `manga/${folder.name}/${c.name}`);
  const allMarked = paths.every(p => deletedSet.has(p));

  if (allMarked) {
    paths.forEach(p => deletedSet.delete(p));
    card.classList.remove('marked');
    showToast(`✓ 取消标记「${folder.name}」(${children.length} 张)`);
    syncDelete(paths);
  } else {
    paths.forEach(p => deletedSet.add(p));
    card.classList.add('marked');
    showToast(`🗑 标记删除「${folder.name}」(${children.length} 张)`);
    syncInsert(paths);
  }

  updateStats();
}

// ─────────────────────────────────────────────
//  Folder inner page
// ─────────────────────────────────────────────
function openFolder(folder, fromPopState = false) {
  if (fromPopState !== true) {
    const scrollArea = document.getElementById('scroll-area');
    homeScrollTop = scrollArea ? scrollArea.scrollTop : 0;
    history.pushState({ view: 'folder', name: folder.name }, '', '#folder=' + encodeURIComponent(folder.name));
  }
  curFolder = folder;
  clearObservers();

  document.getElementById('folder-grid').style.display = 'none';
  const pagContainer = document.getElementById('pagination-container');
  if (pagContainer) pagContainer.style.display = 'none';
  document.getElementById('image-grid').style.display  = 'grid';
  document.getElementById('crumb-sep').style.display   = 'inline';
  const crumbFolder = document.getElementById('crumb-folder');
  crumbFolder.style.display  = 'inline';
  crumbFolder.textContent    = folder.name;
  document.getElementById('scroll-area').scrollTop = 0;

  const grid = document.getElementById('image-grid');
  grid.innerHTML = '';

  const children = folder.children || [];
  if (!children.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🖼</div>文件夹为空</div>';
    updateStats();
    return;
  }

  // build modal list for this folder
  modalList = children.map(child => ({
    src:  `${BASE_URL}/${encodeURIComponent(folder.name)}/${encodeURIComponent(child.name)}`,
    path: `manga/${folder.name}/${child.name}`
  }));

  children.forEach((child, index) => {
    const path = `manga/${folder.name}/${child.name}`;
    const src  = `${BASE_URL}/${encodeURIComponent(folder.name)}/${encodeURIComponent(child.name)}`;
    const marked = deletedSet.has(path);

    const card = document.createElement('div');
    card.className = 'img-card' + (marked ? ' marked' : '') + (mode === 'delete' ? ' delete-mode' : ' view-mode');
    card.dataset.path = path;
    card.dataset.index = index;

    card.innerHTML = `
      <img data-src="${src}" alt="${child.name}">
      <div class="mark-overlay"><div class="mark-icon">✕</div></div>
      <div class="img-name">${child.name}</div>
    `;

    card.addEventListener('click', () => {
      if (mode === 'delete') {
        toggleImageMark(card, path);
      } else {
        openModal(index);
      }
    });

    grid.appendChild(card);
  });

  setupLazy(grid);
  updateStats();
}

function toggleImageMark(card, path) {
  if (deletedSet.has(path)) {
    deletedSet.delete(path);
    card.classList.remove('marked');
    syncDelete([path]);
  } else {
    deletedSet.add(path);
    card.classList.add('marked');
    syncInsert([path]);
  }
  updateStats();
}

// ─────────────────────────────────────────────
//  Export
// ─────────────────────────────────────────────
function exportList() {
  if (!deletedSet.size) { showToast('没有标记删除的图片'); return; }

  const lines    = [...deletedSet].sort().join('\n');
  const blob     = new Blob([lines], { type: 'text/plain;charset=utf-8' });
  const url      = URL.createObjectURL(blob);
  const a        = document.createElement('a');
  const ts       = new Date().toISOString().slice(0,19).replace(/[T:]/g, '-');
  a.href         = url;
  a.download     = `delete_list_${ts}.txt`;
  a.click();
  URL.revokeObjectURL(url);

  showToast(`✓ 已导出 ${deletedSet.size} 条记录`);
}

// ─────────────────────────────────────────────
//  Scroll to top
// ─────────────────────────────────────────────
document.getElementById('scroll-area').addEventListener('scroll', function() {
  const btn = document.getElementById('back-top');
  btn.classList.toggle('visible', this.scrollTop > 400);
});

function scrollToTop() {
  document.getElementById('scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
}

// ─────────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─────────────────────────────────────────────
//  Modal
// ─────────────────────────────────────────────
function openModal(index, fromPopState = false) {
  if (!modalList.length) return;
  if (fromPopState !== true) {
    history.pushState({ view: 'modal', index: index }, '', '#img=' + index);
  }
  modalIndex = index;
  renderModal();
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-close').style.display = 'flex';
  document.getElementById('modal-counter').style.display = 'block';
}

function closeModal(fromPopState = false) {
  if (fromPopState !== true) {
    history.back();
    return;
  }
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-close').style.display = 'none';
  document.getElementById('modal-counter').style.display = 'none';
}

function renderModal() {
  const item = modalList[modalIndex];
  if (!item) return;

  const img = document.getElementById('modal-img');
  img.classList.add('loading');
  img.src = item.src;
  img.onload  = () => img.classList.remove('loading');
  img.onerror = () => img.classList.remove('loading');

  document.getElementById('modal-prev').classList.toggle('hidden', modalIndex === 0);
  document.getElementById('modal-next').classList.toggle('hidden', modalIndex === modalList.length - 1);
  document.getElementById('modal-counter').textContent = `${modalIndex + 1} / ${modalList.length}`;
}

function modalNav(dir) {
  const next = modalIndex + dir;
  if (next < 0 || next >= modalList.length) return;
  modalIndex = next;
  renderModal();
}

// Keyboard
document.addEventListener('keydown', e => {
  const modal = document.getElementById('modal');
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape' || e.key === 'Enter') { closeModal(); return; }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    modalNav(-1);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  modalNav(1);
});

// Touch swipe to close (vertical)
let touchStartY = 0;
let touchStartX = 0;
let multiTouchActive = false;

document.getElementById('modal').addEventListener('touchstart', e => {
  if (e.touches.length > 1) {
    multiTouchActive = true;
    return;
  }
  if (e.touches.length === 1) {
    multiTouchActive = false;
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }
}, { passive: true });

document.getElementById('modal').addEventListener('touchmove', e => {
  if (e.touches.length > 1) multiTouchActive = true;
}, { passive: true });

document.getElementById('modal').addEventListener('touchend', e => {
  if (multiTouchActive || e.changedTouches.length === 0) return;
  
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dx = e.changedTouches[0].clientX - touchStartX;
  
  if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 60) {
    closeModal(); // swipe up or down to close
  } else if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
    modalNav(dx < 0 ? 1 : -1); // swipe left/right to navigate
  }
}, { passive: true });

// Click backdrop to close
document.getElementById('modal-backdrop').addEventListener('click', closeModal);

// ─────────────────────────────────────────────
//  Start
// ─────────────────────────────────────────────
init();
</script>
